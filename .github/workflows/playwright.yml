name: QA Automation — Mudapedia

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly regression, Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: Functional (smoke + regression + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:smoke
      - name: Regression tests
        run: npm run test:regression
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: functional-evidence
          path: |
            playwright-report/
            reports/
            test-results/
          retention-days: 14

  visual:
    name: Visual regression (Applitools)
    runs-on: ubuntu-latest
    needs: functional
    timeout-minutes: 20
    env:
      CI: true
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Visual tests (skipped when no API key)
        if: env.APPLITOOLS_API_KEY != ''
        run: npm run test:visual
      - name: Upload visual evidence
        if: ${{ !cancelled() && env.APPLITOOLS_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: |
            playwright-report/
            reports/
          retention-days: 14
